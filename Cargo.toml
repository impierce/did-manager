[package]
name = "did_manager"
version = "0.1.0"
edition = "2021"
description = "Resolve, create and sign DIDs for various methods"
homepage = "https://www.impierce.com/"
license = "Apache-2.0"
repository = "https://github.com/impierce/did-manager"

[workspace]
resolver = "2"
members = [
    "consumer",
    "did_iota",
    "did_jwk",
    "did_key",
    "did_web",
    "identity_stronghold_ext",
    "producer",
    "shared",
]

[dependencies]
consumer = { path = "consumer" }
producer = { path = "producer" }

[workspace.package]
homepage = "https://www.impierce.com/"
license = "Apache-2.0"
repository = "https://github.com/impierce/did-manager"
rust-version = "1.75"

[workspace.dependencies]
identity_iota = { git = "https://github.com/iotaledger/identity", tag = "v1.6.0-beta.1", default-features = false, features = [
    "resolver",
    "iota-client",
    "send-sync",
] }
identity_storage = { git = "https://github.com/iotaledger/identity", tag = "v1.6.0-beta.1", default-features = false }
identity_stronghold = { git = "https://github.com/iotaledger/identity", tag = "v1.6.0-beta.1", features = [
    "send-sync-storage",
] }
identity_verification = { git = "https://github.com/iotaledger/identity", tag = "v1.6.0-beta.1", default-features = false }
iota-sdk = { git = "https://github.com/iotaledger/iota", package = "iota-sdk", tag = "v0.12.0-rc" }
iota-sdk-legacy = { package = "iota-sdk", version = "1.1", features = [
    "stronghold",
] }
iota_stronghold = { version = "2.1" }
log = "0.4"
rand = "0.8"
serde_json = "1.0"
signature = "2.2"
test-log = "0.2"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
